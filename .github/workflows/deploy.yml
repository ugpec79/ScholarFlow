name: Deploy Container Apps to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: scholarflow
  ENV_NAME: scholarflow-env
  LOCATION: eastus

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Azure CLI
        uses: azure/CLI@v1
        with:
          azcliversion: 2.59.0

      - name: Check if Already Deployed
        id: check
        run: |
          APP_NAME=elasticsearch
          if az containerapp show --name $APP_NAME --resource-group $RESOURCE_GROUP --query "name" -o tsv 2>/dev/null; then
            echo "Container apps already deployed. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Resource Group and Environment
        if: steps.check.outputs.skip == 'false'
        run: |
          az group show --name $RESOURCE_GROUP || \
          az group create --name $RESOURCE_GROUP --location $LOCATION

          az containerapp env show --name $ENV_NAME --resource-group $RESOURCE_GROUP || \
          az containerapp env create \
            --name $ENV_NAME \
            --resource-group $RESOURCE_GROUP \
            --location $LOCATION

      - name: Deploy Elasticsearch
        if: steps.check.outputs.skip == 'false'
        run: |
          az containerapp create \
            --name elasticsearch \
            --resource-group $RESOURCE_GROUP \
            --environment $ENV_NAME \
            --image docker.elastic.co/elasticsearch/elasticsearch:8.12.2 \
            --target-port 9200 \
            --ingress external \
            --env-vars discovery.type=single-node \
                        xpack.security.enabled=false \
                        bootstrap.memory_lock=true \
                        ES_JAVA_OPTS="-Xms4g -Xmx4g" \
                        thread_pool.search.queue_size=1000

      - name: Deploy Qdrant
        if: steps.check.outputs.skip == 'false'
        run: |
          az containerapp create \
            --name qdrant \
            --resource-group $RESOURCE_GROUP \
            --environment $ENV_NAME \
            --image qdrant/qdrant:v1.9.0 \
            --target-port 6333 \
            --ingress external

      - name: Deploy Neo4j
        if: steps.check.outputs.skip == 'false'
        run: |
          az containerapp create \
            --name neo4j \
            --resource-group $RESOURCE_GROUP \
            --environment $ENV_NAME \
            --image neo4j:5.15 \
            --target-port 7474 \
            --ingress external \
            --env-vars NEO4J_AUTH=neo4j/password \
                        NEO4J_dbms_memory_pagecache_size=2G \
                        NEO4J_dbms_memory_heap_initial__size=2G \
                        NEO4J_dbms_memory_heap_max__size=4G

      - name: Deploy Redis
        if: steps.check.outputs.skip == 'false'
        run: |
          az containerapp create \
            --name redis \
            --resource-group $RESOURCE_GROUP \
            --environment $ENV_NAME \
            --image redis:7.2 \
            --target-port 6379 \
            --ingress external \
            --command "redis-server" "--appendonly" "yes"

      - name: Deploy LLaMA (Ollama) and Pull LLaMA 3.2
        if: steps.check.outputs.skip == 'false'
        run: |
          az containerapp create \
            --name llama \
            --resource-group $RESOURCE_GROUP \
            --environment $ENV_NAME \
            --image ollama/ollama:latest \
            --target-port 11434 \
            --ingress external \
            --command "/bin/sh" "-c" "ollama pull llama3 && tail -f /dev/null"
